apiVersion: v1
kind: ConfigMap
metadata:
  name: multitool-config
data:
  HTTP_PORT: "8080"
  HTTPS_PORT: "11443"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-page-config
data:
  index.html: |
    <html>
    <head><title>DevOps Lab</title></head>
    <body>
      <h1>Hello from ConfigMap! Task 1 is successfully completed.</h1>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
      - name: multitool
        image: wbitt/network-multitool
        envFrom:
        - configMapRef:
            name: multitool-config
        ports:
        - containerPort: 8080
      volumes:
      - name: html-volume
        configMap:
          name: nginx-page-config
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  type: NodePort
  selector:
    app: web-app
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080